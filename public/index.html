<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Midterm Practical Lab — Classical Cryptography and Steganography">
  <meta name="robots" content="noindex,nofollow">
  <title>Midterm Lab — Cryptographic Investigation</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <div class="wrap">

    <header class="hdr">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="9" y="20" width="26" height="18" rx="3" stroke="#5a7c65" stroke-width="2" />
        <path d="M15 20V15a7 7 0 1 1 14 0v5" stroke="#5a7c65" stroke-width="2" stroke-linecap="round" />
        <circle cx="22" cy="30" r="2.5" fill="#5a7c65" />
        <line x1="22" y1="32.5" x2="22" y2="35" stroke="#5a7c65" stroke-width="2" stroke-linecap="round" />
      </svg>
      <h1>Midterm Practical Lab</h1>
      <p>Classical Cryptography and Steganography</p>
    </header>

    <main class="card" id="main-card">
      <div class="alert" id="alert" role="alert"></div>

      <form id="lab-form" novalidate>
        <div class="field">
          <label for="f-first">First Name</label>
          <input type="text" id="f-first" placeholder="First name" autocomplete="given-name" required maxlength="50">
        </div>
        <div class="field">
          <label for="f-father">Father Name</label>
          <input type="text" id="f-father" placeholder="Father name" autocomplete="additional-name" required
            maxlength="50">
        </div>
        <div class="field">
          <label for="f-family">Family Name</label>
          <input type="text" id="f-family" placeholder="Family name" autocomplete="family-name" required maxlength="50">
        </div>
        <div class="field">
          <label for="f-id">Student ID</label>
          <input type="text" id="f-id" placeholder="University ID number" autocomplete="off" required maxlength="16"
            inputmode="numeric">
          <span class="hint">Numeric only digits.</span>
          <div class="errmsg" id="id-err"></div>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">
          <span class="spinner"></span>
          <span class="btn-label">Generate Assignment</span>
        </button>
      </form>

      <div class="done" id="done-state">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="22" stroke="#5a7c65" stroke-width="2" />
          <path d="M15 24l6 6 12-12" stroke="#5a7c65" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
        <h2>Assignment Downloaded</h2>
        <p>
          Your unique lab assignment has been saved.<br>
          Extract the ZIP file and read <strong>README.md</strong> before starting.<br><br>
          You will defend your work in an oral examination.
        </p>
      </div>
    </main>

    <footer class="ftr">
      <hr>
      <p>Cryptographic Investigation Lab</p>
    </footer>

  </div>
  <script src="/js/main.js"></script>
</body>

</html>
